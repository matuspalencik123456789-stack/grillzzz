
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: grillz
      POSTGRES_PASSWORD: grillz
      POSTGRES_DB: grillz_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grillz -d grillz_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: grillz
      MINIO_ROOT_PASSWORD: grillz-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 grillz grillz-secret &&
      mc mb --ignore-existing local/grillz-studio &&
      exit 0"

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    profiles: ["full"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://grillz:grillz@postgres:5432/grillz_studio?schema=public
    command: ["sh", "-c", "cd packages/database && npx prisma migrate deploy --schema=prisma/schema.prisma"]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://grillz:grillz@postgres:5432/grillz_studio?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: grillz-studio
      S3_ACCESS_KEY_ID: grillz
      S3_SECRET_ACCESS_KEY: grillz-secret
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-min-32-characters!!}
      API_PORT: 4000
      API_CORS_ORIGIN: ${PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "4000:4000"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        # Origin the *browser* uses to reach the API — baked into the client
        # bundle at build time. Override for any non-localhost deployment.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
    profiles: ["full"]
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000}
      API_INTERNAL_URL: http://backend:4000
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production-min-32-characters!!}
      AUTH_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
